# ThaleOS Trading Unified - Alertmanager Configuration
# Production alerting with multiple notification channels

global:
  # Global configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@thaleos.network'
  smtp_auth_username: 'alerts@thaleos.network'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Default template paths
  templates:
    - '/etc/alertmanager/templates/*.tmpl'
  
  # External URL for building links
  external_url: 'https://alerts.thaleos.network'

# Route configuration - how alerts are routed to receivers
route:
  # Default receiver for all alerts
  receiver: 'default-notifications'
  
  # Grouping configuration
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  # Sub-routes for specific alert types
  routes:
    # Critical system alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: true
    
    # Trading system alerts - high priority
    - match:
        component: trading
      receiver: 'trading-alerts'
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 1h
      continue: true
    
    # Exchange connectivity issues
    - match:
        component: exchange
      receiver: 'exchange-alerts'
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 15m
      continue: true
    
    # Security alerts - immediate attention
    - match:
        component: security
      receiver: 'security-alerts'
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 30m
      continue: true
    
    # Database alerts
    - match:
        component: database
      receiver: 'database-alerts'
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 2h
    
    # Business metrics - lower priority
    - match:
        component: business
      receiver: 'business-alerts'
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h
    
    # Warning alerts - standard handling
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 6h

# Notification receivers
receivers:
  # Default notifications (Slack + Email)
  - name: 'default-notifications'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-alerts'
        title: 'ThaleOS Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    
    email_configs:
      - to: 'admin@thaleos.network'
        subject: 'ThaleOS Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Component: {{ .Labels.component }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}

  # Critical alerts (Multiple channels + PagerDuty)
  - name: 'critical-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-critical'
        title: '🚨 CRITICAL: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          <!channel> CRITICAL ALERT
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Component:* {{ .Labels.component }}
          *Instance:* {{ .Labels.instance }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true
        color: 'danger'
    
    email_configs:
      - to: 'critical@thaleos.network,admin@thaleos.network'
        subject: '🚨 CRITICAL ThaleOS Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        body: |
          CRITICAL ALERT - IMMEDIATE ACTION REQUIRED
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          
          {{ end }}
    
    # PagerDuty integration for critical alerts
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_INTEGRATION_KEY}'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          component: '{{ .CommonLabels.component }}'
          severity: '{{ .CommonLabels.severity }}'
          instance: '{{ .CommonLabels.instance }}'
        links:
          - href: '{{ .ExternalURL }}'
            text: 'Alertmanager'
          - href: 'https://grafana.thaleos.network'
            text: 'Grafana Dashboard'

  # Trading system alerts
  - name: 'trading-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-trading'
        title: '📈 Trading Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Trading System Alert*
          *Issue:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Component:* {{ .Labels.component }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
    
    webhook_configs:
      - url: '${TRADING_WEBHOOK_URL}'
        send_resolved: true

  # Exchange connectivity alerts
  - name: 'exchange-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-exchanges'
        title: '🔄 Exchange Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Exchange Connectivity Issue*
          *Exchange:* {{ .Labels.exchange }}
          *Issue:* {{ .Annotations.summary }}
          *Status:* {{ .Status }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Security alerts
  - name: 'security-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-security'
        title: '🔒 Security Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          <!here> Security Alert
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Component:* {{ .Labels.component }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
        color: 'danger'
    
    email_configs:
      - to: 'security@thaleos.network'
        subject: '🔒 Security Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  # Database alerts
  - name: 'database-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-infrastructure'
        title: '🗄️ Database Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Database Alert*
          *Issue:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Database:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true

  # Business metrics alerts
  - name: 'business-alerts'
    slack_configs:
      - api_url: '${SLACK_BUSINESS_WEBHOOK_URL}'
        channel: '#thaleos-business'
        title: '📊 Business Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Business Metrics Alert*
          *Metric:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: 'warning'

  # Warning level alerts
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#thaleos-warnings'
        title: '⚠️ Warning: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >
          {{ range .Alerts }}
          *Warning Alert*
          *Issue:* {{ .Annotations.summary }}
          *Component:* {{ .Labels.component }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
        color: 'warning'

# Inhibition rules - suppress alerts based on other alerts
inhibit_rules:
  # Suppress warning alerts if critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'instance']
  
  # Suppress individual service alerts if the entire system is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']
  
  # Suppress database connection alerts if database is down
  - source_match:
      alertname: 'DatabaseConnectionsHigh'
    target_match:
      component: 'database'
    equal: ['instance']

# Template configurations for custom formatting
templates:
  - '/etc/alertmanager/templates/default.tmpl'

# Webhook configuration for external integrations
webhook_config:
  # Discord webhook (optional)
  discord_configs:
    - webhook_url: '${DISCORD_WEBHOOK_URL}'
      title: 'ThaleOS Alert'
      message: >
        {{ range .Alerts }}
        **{{ .Annotations.summary }}**
        {{ .Annotations.description }}
        Component: {{ .Labels.component }}
        {{ end }}

# Test notification endpoint (for webhook testing)
test_webhook:
  url: 'https://webhook-test.thaleos.network/alerts'
  method: 'POST'
  headers:
    'Content-Type': 'application/json'
    'Authorization': 'Bearer ${WEBHOOK_TOKEN}'

# Cluster configuration for high availability
cluster:
  # Cluster name for identification
  name: 'thaleos-alertmanager'
  
  # Peer addresses for clustering
  peers:
    - 'alertmanager-01.thaleos.network:9094'
    - 'alertmanager-02.thaleos.network:9094'
  
  # Network settings
  listen_address: '0.0.0.0:9094'
  settle_timeout: '45s'
  
  # Gossip protocol settings
  gossip_interval: '200ms'
  peer_timeout: '15s'
  push_pull_interval: '60s'

# API configuration
api:
  v2:
    # Enable API v2
    enabled: true
    
    # CORS configuration
    cors:
      enabled: true
      allowed_origins: 
        - 'https://grafana.thaleos.network'
        - 'https://alerts.thaleos.network'