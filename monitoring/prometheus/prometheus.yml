# ThaleOS Trading Unified - Prometheus Configuration
# Production monitoring setup with comprehensive metrics collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'thaleos-trading-production'
    environment: 'production'

# Rule files for alerting
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager.thaleos.network:9093
      path_prefix: /
      scheme: https
      timeout: 10s
      api_version: v2

# Scrape configurations
scrape_configs:
  # ThaleOS Trading API (Cloudflare Workers)
  - job_name: 'thaleos-trading-api'
    scrape_interval: 15s
    metrics_path: '/api/metrics'
    scheme: https
    static_configs:
      - targets: ['api.trading.thaleos.network']
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']
    
    # Relabeling for better organization
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: api.trading.thaleos.network:443

  # ThaleOS Trading Frontend (Cloudflare Pages)
  - job_name: 'thaleos-trading-frontend'
    scrape_interval: 30s
    metrics_path: '/metrics'
    scheme: https
    static_configs:
      - targets: ['trading.thaleos.network']
    scrape_timeout: 10s
    
    # Only scrape if metrics endpoint exists
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        target_label: __tmp_up
        replacement: '1'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: 
        - 'localhost:9100'
        - 'thaleos-db:9100'
        - 'thaleos-redis:9100'
    
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: hostname
        replacement: '${1}'

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['thaleos-db:9187']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'thaleos-trading-db'

  # Redis Exporter
  - job_name: 'redis-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['thaleos-redis:9121']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'thaleos-trading-redis'

  # Nginx Exporter
  - job_name: 'nginx-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9113']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'thaleos-nginx'

  # Custom ThaleOS Services
  - job_name: 'thaleos-job-processor'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'job-processor'

  - job_name: 'thaleos-market-data'
    scrape_interval: 10s  # More frequent for market data
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9091']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'market-data-collector'

  - job_name: 'thaleos-websocket'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9092']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'websocket-server'

  # Cloudflare Analytics (via custom exporter)
  - job_name: 'cloudflare-analytics'
    scrape_interval: 60s  # Less frequent due to API limits
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9094']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'cloudflare-exporter'

  # Exchange API Health Monitoring
  - job_name: 'exchange-health'
    scrape_interval: 30s
    metrics_path: '/health'
    scheme: https
    static_configs:
      - targets: 
        - 'api.binance.com'
        - 'api.coinbase.com'
        - 'api.kraken.com'
    
    # Custom health check to metrics conversion
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'probe_success'
        target_label: __name__
        replacement: 'exchange_health_status'
    
    relabel_configs:
      - source_labels: [__address__]
        regex: 'api\.(.+)\.com'
        target_label: exchange
        replacement: '${1}'

  # Blackbox Exporter for endpoint monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://trading.thaleos.network
        - https://api.trading.thaleos.network/api/health
        - https://trading.thaleos.network/health
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # SSL Certificate Monitoring
  - job_name: 'ssl-expiry'
    metrics_path: /probe
    params:
      module: [ssl_expiry]
    static_configs:
      - targets:
        - trading.thaleos.network:443
        - api.trading.thaleos.network:443
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prometheus-server'

# Remote write configuration for long-term storage
remote_write:
  - url: "https://prometheus-remote-write.thaleos.network/api/v1/write"
    remote_timeout: 30s
    queue_config:
      capacity: 10000
      max_shards: 50
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
    
    # Optional: Add authentication headers
    headers:
      "X-Scope-OrgID": "thaleos-trading"
    
    # Write relabeling (optional - for filtering what gets stored long-term)
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*|promhttp_.*|prometheus_.*'
        action: drop

# Storage configuration
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 15d
    retention.size: 10GB
    wal-compression: true

# Global configuration
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  
  # External labels for federation/remote write
  external_labels:
    cluster: 'thaleos-trading'
    environment: 'production'
    region: 'global'
    replica: 'prometheus-01'